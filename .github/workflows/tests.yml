name: Tests and packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pip check
      - name: Require the real image stack, not skipped substitutes
        run: python -c "import imagecodecs; from omeify.utils.ome_schema_validator import OMESchemaValidator; OMESchemaValidator()"
      - run: python -m pytest -q
      # Do not turn historical formatting debt into an unrelated rewrite. The
      # full configured style review is documented separately; fatal lint gates CI.
      - run: python -m ruff check --select E9,F63,F7,F82 .

  python310_numpy1:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install -c constraints/python310-numpy1.txt '.[dev]'
      - run: python -m pip check
      - name: Require the constrained runtime and actual codecs/XSD
        run: python -c "import sys, numpy, imagecodecs; from omeify.utils.ome_schema_validator import OMESchemaValidator; assert sys.version_info[:2] == (3, 10); assert numpy.__version__ == '1.26.4'; OMESchemaValidator()"
      - run: python -m pytest -q

  optional_intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev,intelligence]'
      - run: python -m pip check
      - run: python -c "import sheetbend, llm, openai"
      - name: Real optional-library integration with a loopback HTTP fixture
        run: python -m pytest -q tests/test_intelligence.py tests/test_intelligence_questions.py tests/test_intelligence_sheetbend.py tests/test_intelligence_integration.py tests/test_visual_regions.py

  distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - name: Build the wheel from the sdist through the declared Hatch backend
        run: python -m build
      - name: Install outside the checkout and exercise packaged schemas and pixels
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/omeify-wheel-env"
          "$RUNNER_TEMP/omeify-wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/omeify-wheel-env/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/omeify-wheel-env/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_smoke.py"
