[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omeify"
version = "0.22.1"
description = "Predictable, metadata-minimized OME-TIFF and OME-Zarr image I/O"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Jason L Weirather" },
]
keywords = [
  "OME-TIFF",
  "OME-Zarr",
  "microscopy",
  "pathology",
  "whole slide imaging",
  "H&E",
  "SVS",
  "SCN",
  "multiplex imaging",
  "MITI",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "click>=8.1,<9",
  "tqdm>=4.66,<5",
  "numpy>=1.26.4,<3",
  # Retain the supported TIFF/codec branches for the Python 3.11 baseline.
  "tifffile>=2024.8.30,<2026.4.11; python_version == '3.11'",
  "tifffile>=2024.8.30,<2027; python_version >= '3.12'",
  # LZW and most TIFF compression codecs are supplied by imagecodecs.
  "imagecodecs>=2024.6.1,<2026.5.10; python_version == '3.11'",
  "imagecodecs>=2024.6.1,<2027; python_version >= '3.12'",
  # Keep segmentation and image-analysis stacks (for example scikit-image) out of omeify.
  "lxml>=5,<7",
  "jsonschema>=4.20,<5",
  "referencing>=0.31,<1",
  # Supplies a local OME 2016-06 XSD, avoiding validation-time network access.
  "ome-schema>=0.1.0",
  # OME-Zarr, including HTTP reads, is part of every ordinary installation.
  "zarr>=3.1.3,<4",
  "fsspec[http]>=2024.6,<2027",
]

[project.urls]
Homepage = "https://github.com/jason-weirather/omeify"
Repository = "https://github.com/jason-weirather/omeify"
Issues = "https://github.com/jason-weirather/omeify/issues"

[project.scripts]
omeify = "omeify.cli:main"

[project.optional-dependencies]
# Independent format models are tests, not a runtime model/validation framework.
# This extra currently requires Python 3.12+ through the upstream models package.
interop = ["ome-zarr-models>=1.8.1,<2"]
# Sheetbend 0.5 owns source selection; its llm extra owns inference dependencies.
# No Python marker: requesting intelligence on Python <3.13 must fail, not install
# an apparently successful but empty extra. Base omeify requires Python >=3.11.
intelligence = ["sheetbend[llm]>=0.5.0,<0.6"]
dev = [
  "build>=1.2",
  "pytest>=8,<10",
  "packaging>=22",
  "ruff>=0.12",
]

# JSON contracts are runtime data, not optional source-tree documentation.
[tool.hatch.build]
artifacts = ["omeify/schemas/*.schema.json"]

[tool.hatch.build.targets.sdist]
include = [
  "/omeify", "/tests", "/examples", "/docs", "/constraints",
  "/pyproject.toml", "/README.md", "/LICENSE", "/Dockerfile", "/environment.yml",
]

[tool.hatch.build.targets.wheel]
packages = ["omeify"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
